[project]
name = "henosync-plugin-sdk"
version = "0.1.0"
description = "Plugin SDK for Henosync robot mission planner"
authors = [{ name = "Henosync Team — Monash University" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0"]

[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["henosync_sdk*"]
